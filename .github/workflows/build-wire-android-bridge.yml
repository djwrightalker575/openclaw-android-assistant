name: Build WIRE Android Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - wire/android-mcp-bridge-v0
    paths:
      - 'android/wirebridge/**'
      - 'android/settings.gradle.kts'
      - '.github/workflows/build-wire-android-bridge.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download official tunnel-client Linux ARM64 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p android/wirebridge/src/main/assets /tmp/tunnel
          api='https://api.github.com/repos/openai/tunnel-client/releases/tags/v0.0.10'
          url="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api" | jq -r '.assets[] | select(.name | test("linux-arm64.*\\.zip$")) | .browser_download_url' | head -n1)"
          test -n "$url"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$url" -o /tmp/tunnel/tunnel.zip
          unzip -q /tmp/tunnel/tunnel.zip -d /tmp/tunnel/unpacked
          binary="$(find /tmp/tunnel/unpacked -type f -name 'tunnel-client*' ! -name '*.md' ! -name '*.txt' | head -n1)"
          test -f "$binary"
          cp "$binary" android/wirebridge/src/main/assets/tunnel-client-linux-arm64
          chmod 0755 android/wirebridge/src/main/assets/tunnel-client-linux-arm64
          file android/wirebridge/src/main/assets/tunnel-client-linux-arm64

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :wirebridge:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WIRE-Android-Bridge-debug
          path: android/wirebridge/build/outputs/apk/debug/wirebridge-debug.apk
          if-no-files-found: error
